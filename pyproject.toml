[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movieroll"
version = "0.1.0"
description = "MovieRoll: a systematic framework for rolling out long-form videos"
readme = "README.md"
requires-python = ">=3.12"
# requirements.txt stays the single source of truth for runtime pins; see [tool.setuptools.dynamic].
dynamic = ["dependencies"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
# The two backend adapters are separate: `sglang_movieroll` is installed against SGLang and
# `vllm_omni_movieroll` ships its own pyproject, so neither belongs to this distribution.
include = ["movieroll", "movieroll.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the one CI can do: no GPU, no gated checkpoints. Opt in with
# `pytest -m gpu` / `pytest -m weights` where those resources exist.
addopts = "-m 'not gpu and not weights'"
markers = [
    "gpu: needs a CUDA device (no checkpoints needed)",
    "weights: needs the gated Hugging Face checkpoints",
]
